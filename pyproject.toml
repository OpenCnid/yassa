[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "yassa"
version = "0.1.0"
description = "Traceable skill experiments through Inspect AI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic==1.4.0",
    "google-genai==2.22.0",
    "inspect-ai==0.3.263",
    "openai==3.11.0",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
]

[project.scripts]
yassa = "yassa.app:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"runtime/codex" = "yassa/_native_runtime"
"runtime/claude" = "yassa/_claude_runtime"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
