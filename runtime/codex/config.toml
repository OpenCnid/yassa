model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
approval_policy = "never"
web_search = "disabled"
cli_auth_credentials_store = "file"
default_permissions = "trial"

[features]
multi_agent = true

[permissions.trial]
extends = ":workspace"

[permissions.trial.filesystem]
"/home/runtime/codex/auth.json" = "deny"
"/home/runtime/codex/config.toml" = "read"
"/work/.agents" = "read"
"/work/input" = "read"
"/work/.git" = "read"

[permissions.trial.network]
enabled = false
